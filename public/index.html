<!doctype html>
<html lang="id" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Intelligence Platform</title>
<style>
/* ===== Design tokens =====
   Style: Data-Dense Dashboard. Density 8/10 — spacing 8-32px, bukan 24-96px.
   Semua warna lewat token; tidak ada hex mentah di komponen. */
:root{
  --primary:#1E40AF; --on-primary:#fff; --secondary:#3B82F6; --accent:#D97706;
  --bg:#F8FAFC; --surface:#fff; --surface-2:#F1F5F9;
  --fg:#0F172A; --fg-muted:#475569; --border:#DBEAFE; --border-strong:#94A3B8;
  --ok:#15803D; --warn:#B45309; --bad:#DC2626; --ring:#1E40AF;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r:6px; --r-lg:10px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.1);
  --dur:180ms;
}
:root[data-theme="dark"],
@media (prefers-color-scheme:dark){}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#111827; --surface-2:#1E293B;
  --fg:#E2E8F0; --fg-muted:#94A3B8; --border:#1E293B; --border-strong:#334155;
  --primary:#3B82F6; --secondary:#60A5FA; --accent:#F59E0B;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --ring:#60A5FA;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120; --surface:#111827; --surface-2:#1E293B;
    --fg:#E2E8F0; --fg-muted:#94A3B8; --border:#1E293B; --border-strong:#334155;
    --primary:#3B82F6; --secondary:#60A5FA; --accent:#F59E0B;
    --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --ring:#60A5FA;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Header ===== */
.top{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s5);
  background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:600;font-size:15px}
.brand svg{width:20px;height:20px;color:var(--primary);flex:none}
.stat-strip{display:flex;gap:var(--s4);margin-left:auto;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--border);font-size:12px;font-family:var(--mono);color:var(--fg-muted);background:var(--surface-2)}
.chip.live{color:var(--ok);border-color:currentColor}
.chip.down{color:var(--bad);border-color:currentColor}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
  border:1px solid var(--border);background:var(--surface);color:var(--fg-muted);
  border-radius:var(--r);cursor:pointer;transition:color var(--dur),border-color var(--dur)}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.icon-btn svg{width:18px;height:18px}

/* ===== Tabs ===== */
.tabs{display:flex;gap:var(--s1);padding:0 var(--s5);background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s3);
  background:none;border:0;border-bottom:2px solid transparent;color:var(--fg-muted);
  font:500 14px/1 var(--sans);cursor:pointer;white-space:nowrap;transition:color var(--dur),border-color var(--dur)}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.tabs svg{width:16px;height:16px}

main{padding:var(--s5);max-width:1400px;margin:0 auto}
section[hidden]{display:none}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted);
  margin:var(--s5) 0 var(--s3);font-weight:600}
h2:first-child{margin-top:0}

/* ===== Controls ===== */
.toolbar{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
select,input{min-height:44px;padding:0 var(--s3);background:var(--surface);color:var(--fg);
  border:1px solid var(--border-strong);border-radius:var(--r);font:14px var(--sans);transition:border-color var(--dur)}
input{flex:1;min-width:220px;font-family:var(--mono)}
select:hover,input:hover{border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);
  background:var(--primary);color:var(--on-primary);border:1px solid transparent;border-radius:var(--r);
  font:500 14px var(--sans);cursor:pointer;transition:opacity var(--dur)}
.btn:hover{opacity:.88}
.btn[disabled]{opacity:.5;cursor:progress}
.btn svg{width:16px;height:16px}
.hint{font-size:13px;color:var(--fg-muted);margin-bottom:var(--s3)}

/* ===== Metrics bar ===== */
.metabar{display:flex;gap:var(--s4);flex-wrap:wrap;font-family:var(--mono);font-size:12px;
  color:var(--fg-muted);margin-bottom:var(--s3)}
.metabar b{color:var(--fg);font-weight:600}
.metabar .fast{color:var(--ok)} .metabar .slow{color:var(--warn)}

/* ===== Cards ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--s4);box-shadow:var(--shadow)}
.card .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted);font-weight:600}
.card .v{font:600 28px/1.1 var(--mono);margin-top:var(--s2);color:var(--fg);word-break:break-word}
.card .v.sm{font-size:17px;font-family:var(--sans)}
.card .n{font-size:12px;color:var(--fg-muted);margin-top:var(--s2)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:var(--s3)}
.meter i{display:block;height:100%;background:var(--ok);transition:width 400ms cubic-bezier(.4,0,.2,1)}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}

/* ===== Table ===== */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px var(--s3);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);
  font-weight:600;background:var(--surface-2);position:sticky;top:0}
tbody tr{transition:background var(--dur)}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);text-align:right}
td.mono,code{font-family:var(--mono);font-size:12px}
code{background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:4px}

/* ===== Badges ===== */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:11px;font-weight:600;border:1px solid currentColor}
.tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
.tag.info{color:var(--secondary)} .tag.neutral{color:var(--fg-muted)}

/* ===== States ===== */
.state{padding:var(--s6) var(--s4);text-align:center;color:var(--fg-muted);font-size:14px;
  border:1px dashed var(--border-strong);border-radius:var(--r-lg);background:var(--surface)}
.state svg{width:28px;height:28px;margin-bottom:var(--s2);opacity:.6}
.error{border:1px solid var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);
  padding:var(--s3) var(--s4);border-radius:var(--r-lg);font-size:14px;display:flex;gap:var(--s2);align-items:flex-start}
.error svg{width:18px;height:18px;flex:none;margin-top:1px}
.note{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);
  padding:var(--s3);border-radius:0 var(--r) var(--r) 0;font-size:13px;color:var(--fg);margin-bottom:var(--s3)}
.spin{width:22px;height:22px;border:2px solid var(--border-strong);border-top-color:var(--primary);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto var(--s3)}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:12px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);
  background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}

@media (max-width:640px){
  main{padding:var(--s3)} .top,.tabs{padding-left:var(--s3);padding-right:var(--s3)}
  .stat-strip{width:100%;margin-left:0}
  .card .v{font-size:22px}
}
</style>
</head>
<body>

<header class="top">
  <span class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>
    </svg>
    Customer Intelligence
  </span>
  <div class="stat-strip">
    <span class="chip" id="c-users"><span class="skel" style="width:70px"></span></span>
    <span class="chip" id="c-db"><span class="dot"></span>checking…</span>
    <button class="icon-btn" id="theme" type="button" aria-label="Ganti tema terang/gelap" title="Ganti tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Bagian dashboard">
  <button role="tab" aria-selected="true" aria-controls="p-search" data-tab="search" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    Search
  </button>
  <button role="tab" aria-selected="false" aria-controls="p-quality" data-tab="quality" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 14 3-4 3 3 5-7"/></svg>
    Data Quality
  </button>
  <button role="tab" aria-selected="false" aria-controls="p-dupes" data-tab="dupes" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>
    Duplicates
  </button>
  <button role="tab" aria-selected="false" aria-controls="p-profile" data-tab="profile" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    User Profile
  </button>
</nav>

<main>
  <section id="p-search" role="tabpanel">
    <div class="toolbar">
      <label class="sr" for="s-type" hidden>Tipe pencarian</label>
      <select id="s-type" aria-label="Tipe pencarian">
        <option value="name">Nama — fuzzy</option>
        <option value="email">Email — exact</option>
        <option value="phone">Telepon — exact</option>
        <option value="user_id">User ID — exact</option>
      </select>
      <input id="s-q" placeholder="komang pipit" aria-label="Kata kunci pencarian" autocomplete="off" spellcheck="false">
      <button class="btn" id="s-go" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Cari
      </button>
    </div>
    <p class="hint" id="s-hint">Pencarian nama memakai trigram (toleran salah ketik). Email, telepon, dan user ID dicocokkan persis.</p>
    <div class="metabar" id="s-meta"></div>
    <div id="s-out"></div>
  </section>

  <section id="p-quality" role="tabpanel" hidden>
    <div id="q-out"></div>
  </section>

  <section id="p-dupes" role="tabpanel" hidden>
    <div class="toolbar">
      <select id="d-method" aria-label="Metode deteksi duplikat">
        <option value="ip_address">IP Address — high</option>
        <option value="email">Email persis — high</option>
        <option value="phone">Telepon persis — high</option>
        <option value="order_history">Pola order — medium</option>
        <option value="activity_pattern">Pola login — low</option>
      </select>
      <input id="d-limit" type="number" value="20" min="1" max="200" style="max-width:120px;flex:none" aria-label="Jumlah maksimal grup">
      <button class="btn" id="d-go" type="button">Analisis</button>
    </div>
    <div class="metabar" id="d-meta"></div>
    <div id="d-out"></div>
  </section>

  <section id="p-profile" role="tabpanel" hidden>
    <div class="toolbar">
      <input id="p-id" value="29270919" aria-label="User ID" inputmode="numeric">
      <button class="btn" id="p-go" type="button">Muat profil</button>
    </div>
    <p class="hint">Menggabungkan 4 tabel: user, orders, transactions, activity.</p>
    <div class="metabar" id="p-meta"></div>
    <div id="p-out"></div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
